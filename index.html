<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173b73" />
  <title>文字式パーク｜小学校6年 算数</title>
  <style>
    :root {
      --ink: #17304f;
      --muted: #64748b;
      --paper: #f7fbff;
      --card: #ffffff;
      --line: #d9e5f2;
      --navy: #173b73;
      --blue: #1f70c1;
      --cyan: #25b9c8;
      --sky: #eaf7ff;
      --mint: #e9fbf4;
      --yellow: #fff5c9;
      --orange: #f28a3b;
      --red: #d9485f;
      --shadow: 0 18px 48px rgba(31, 67, 110, .12);
      --soft-shadow: 0 8px 24px rgba(31, 67, 110, .10);
      --radius-lg: 26px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(37,185,200,.12), transparent 28rem),
        radial-gradient(circle at 90% 5%, rgba(242,138,59,.10), transparent 24rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.6;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 4px solid rgba(37,185,200,.35);
      outline-offset: 2px;
    }
    .app-shell { max-width: 1180px; margin: 0 auto; padding: 18px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px 20px; border: 1px solid rgba(217,229,242,.95);
      background: rgba(255,255,255,.88); backdrop-filter: blur(12px);
      border-radius: 22px; box-shadow: var(--soft-shadow); position: sticky; top: 12px; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 46px; height: 46px; flex: 0 0 46px; display: grid; place-items: center;
      border-radius: 15px; color: white; background: linear-gradient(145deg, var(--navy), var(--blue));
      font-size: 25px; font-weight: 900; box-shadow: 0 8px 18px rgba(23,59,115,.25);
    }
    .brand h1 { margin: 0; font-size: clamp(18px, 2.4vw, 25px); line-height: 1.15; letter-spacing: .02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .stat-pill, .outline-btn, .primary-btn, .ghost-btn {
      border: 0; border-radius: 999px; padding: 10px 15px; font-weight: 800; transition: transform .18s, box-shadow .18s, background .18s;
    }
    .stat-pill { background: var(--sky); color: var(--navy); font-size: 13px; }
    .stat-pill strong { color: var(--blue); font-size: 18px; margin-right: 3px; }
    .outline-btn { background: white; border: 1px solid var(--line); color: var(--navy); }
    .primary-btn { background: var(--navy); color: white; box-shadow: 0 8px 16px rgba(23,59,115,.18); }
    .primary-btn.cyan { background: var(--cyan); color: #073d4a; }
    .ghost-btn { background: transparent; color: var(--blue); padding-left: 8px; padding-right: 8px; }
    .stat-pill:hover, .outline-btn:hover, .primary-btn:hover, .ghost-btn:hover { transform: translateY(-2px); }
    .main-card { margin-top: 18px; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
    .home-wrap { padding: clamp(20px, 4vw, 44px); }
    .hero {
      display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); gap: 26px; align-items: center;
      padding: clamp(20px, 4vw, 38px); border-radius: 23px; color: white;
      background: linear-gradient(125deg, #173b73 0%, #1f70c1 58%, #25b9c8 100%); position: relative; overflow: hidden;
    }
    .hero::after { content: ""; position: absolute; width: 230px; height: 230px; border: 34px solid rgba(255,255,255,.08); border-radius: 50%; right: -75px; top: -92px; }
    .eyebrow { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; font-weight: 900; opacity: .8; }
    .hero h2 { margin: 0; font-size: clamp(29px, 5vw, 54px); line-height: 1.18; letter-spacing: .02em; }
    .hero h2 span { color: #ffe176; }
    .hero-copy { margin: 14px 0 0; max-width: 600px; color: rgba(255,255,255,.87); font-weight: 700; }
    .hero-progress { margin-top: 24px; max-width: 520px; }
    .progress-label { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 900; }
    .progress-track { height: 9px; margin-top: 7px; overflow: hidden; background: rgba(255,255,255,.25); border-radius: 99px; }
    .progress-fill { height: 100%; border-radius: inherit; background: #ffe176; }
    .hero-navi { position: relative; z-index: 1; display: grid; place-items: center; min-height: 230px; }
    .hero-navi img { width: min(100%, 270px); height: 230px; object-fit: contain; filter: drop-shadow(0 16px 12px rgba(4,28,67,.22)); }
    .navi-caption { position: absolute; right: 0; bottom: 2px; padding: 8px 13px; border-radius: 14px 14px 4px 14px; background: rgba(255,255,255,.96); color: var(--navy); font-size: 12px; font-weight: 900; box-shadow: var(--soft-shadow); }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin: 30px 0 14px; }
    .section-heading h3 { margin: 0; font-size: 20px; }
    .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .mode-card {
      min-height: 202px; padding: 19px; text-align: left; border: 1px solid var(--line); border-radius: 20px;
      background: white; color: var(--ink); box-shadow: 0 4px 0 rgba(217,229,242,.7); position: relative; overflow: hidden;
      transition: transform .18s, box-shadow .18s, border-color .18s;
    }
    .mode-card::after { content: ""; position: absolute; width: 100px; height: 100px; border-radius: 50%; right: -42px; bottom: -48px; background: var(--card-accent, #dff7fa); }
    .mode-card:hover { transform: translateY(-4px); box-shadow: 0 12px 22px rgba(31,67,110,.12); border-color: var(--card-accent-strong, var(--cyan)); }
    .mode-number { display: inline-grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; color: white; background: var(--card-accent-strong, var(--blue)); font-weight: 900; font-size: 13px; }
    .mode-card h4 { margin: 18px 0 6px; font-size: 20px; position: relative; z-index: 1; }
    .mode-card p { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; position: relative; z-index: 1; }
    .mode-meta { display: flex; gap: 8px; margin-top: 17px; color: var(--card-accent-strong, var(--blue)); font-size: 12px; font-weight: 900; position: relative; z-index: 1; }
    .study-card { padding: clamp(14px, 3vw, 28px); }
    .study-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .study-title { display: flex; align-items: center; gap: 9px; font-weight: 900; }
    .mode-chip { padding: 7px 11px; color: var(--navy); background: var(--sky); border-radius: 999px; font-size: 12px; }
    .question-count { color: var(--muted); font-size: 13px; font-weight: 900; }
    .study-grid { display: grid; grid-template-columns: minmax(0, 1fr) 265px; gap: 22px; align-items: start; }
    .question-panel { min-width: 0; }
    .question-progress { height: 8px; background: #e7eff7; border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
    .question-progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--blue)); border-radius: inherit; }
    .question-box { padding: clamp(19px, 3vw, 30px); border: 1px solid var(--line); border-radius: 21px; background: linear-gradient(180deg, #fbfdff, #f3f9fd); }
    .question-label { margin: 0; color: var(--blue); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .question-text { margin: 11px 0 0; font-size: clamp(20px, 3.2vw, 29px); line-height: 1.55; font-weight: 900; white-space: pre-wrap; }
    .answer-title { margin: 20px 0 9px; color: var(--muted); font-size: 12px; font-weight: 900; }
    .answer-input {
      width: 100%; min-height: 60px; padding: 12px 16px; border: 2px solid #b7d8ed; border-radius: 15px; color: var(--navy);
      background: white; font-size: 22px; font-weight: 800; letter-spacing: .04em;
    }
    .answer-input:disabled { background: #f1f7fb; color: var(--muted); }
    .choice-list { display: grid; gap: 10px; }
    .choice {
      width: 100%; padding: 14px 16px; text-align: left; border: 2px solid var(--line); border-radius: 14px;
      color: var(--ink); background: white; font-weight: 800; line-height: 1.55; transition: transform .16s, border-color .16s, background .16s;
    }
    .choice:hover { transform: translateX(3px); border-color: var(--cyan); }
    .choice.selected { border-color: var(--blue); background: #eaf4ff; box-shadow: inset 4px 0 0 var(--blue); }
    .palette-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
    .palette-group { padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .palette-group h5 { margin: 0 0 7px; color: var(--muted); font-size: 11px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .key {
      min-height: 36px; padding: 4px 2px; border: 1px solid #cdddea; border-radius: 8px; color: var(--navy);
      background: #f7fbff; font-weight: 900; font-size: 14px;
    }
    .key:hover { background: var(--yellow); border-color: #e4be44; }
    .answer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .answer-actions button { min-height: 48px; border-radius: 13px; }
    .feedback { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; padding: 14px 16px; border-radius: 15px; font-weight: 800; }
    .feedback .feedback-icon { flex: 0 0 25px; font-size: 22px; }
    .feedback.good { color: #0b6441; background: var(--mint); border: 1px solid #bde8d4; }
    .feedback.try { color: #8b3f18; background: #fff5e9; border: 1px solid #f1d3ac; }
    .navi-panel {
      padding: 17px; border: 1px solid var(--line); border-radius: 21px; background: #f7fbff;
      position: sticky; top: 102px; text-align: center;
    }
    .navi-kicker { margin: 0; color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .12em; }
    .navi-panel img { width: 100%; height: 200px; object-fit: contain; margin: 4px auto 0; filter: drop-shadow(0 10px 8px rgba(23,59,115,.12)); }
    .navi-name { margin: 0; font-size: 17px; font-weight: 900; }
    .navi-line { min-height: 53px; margin: 5px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .study-footnote { margin-top: 10px; color: var(--muted); font-size: 11px; text-align: center; }
    .collection-panel { margin-top: 30px; padding: 19px; border: 1px solid var(--line); border-radius: 20px; background: #fbfdff; }
    .collection-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .badge-card { min-width: 0; padding: 11px 7px 9px; border: 1px solid var(--line); border-radius: 14px; text-align: center; background: white; }
    .badge-card img { width: 62px; height: 62px; object-fit: contain; display: block; margin: 0 auto 5px; }
    .badge-card.locked img { filter: grayscale(1); opacity: .22; }
    .badge-card strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .badge-card small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .badge-card.locked strong { color: #94a3b8; }
    .badges-page { padding: clamp(20px, 4vw, 40px); }
    .badges-page-head { display: flex; align-items: end; justify-content: space-between; gap: 15px; margin-bottom: 22px; }
    .badges-page h2 { margin: 0; font-size: 28px; }
    .badges-page-head p { margin: 5px 0 0; color: var(--muted); font-weight: 700; }
    .badge-large-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .badge-large {
      display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 13px; min-height: 130px;
      padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: white;
    }
    .badge-large img { width: 88px; height: 88px; object-fit: contain; }
    .badge-large.locked img { filter: grayscale(1); opacity: .2; }
    .badge-large h3 { margin: 0; font-size: 16px; }
    .badge-large p { margin: 5px 0 0; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.5; }
    .badge-status { display: inline-block; margin-top: 9px; padding: 4px 8px; border-radius: 999px; color: #0b6441; background: var(--mint); font-size: 10px; font-weight: 900; }
    .locked .badge-status { color: #64748b; background: #f1f5f9; }
    .complete-page { padding: clamp(30px, 6vw, 66px) 20px; text-align: center; }
    .complete-page img { width: 210px; height: 210px; object-fit: contain; filter: drop-shadow(0 14px 10px rgba(23,59,115,.14)); }
    .complete-page h2 { margin: 10px 0 5px; font-size: clamp(26px, 5vw, 42px); }
    .complete-page p { margin: 0 auto; color: var(--muted); font-weight: 700; }
    .complete-stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 22px 0; }
    .complete-stat { min-width: 105px; padding: 12px 15px; border-radius: 14px; background: var(--sky); }
    .complete-stat strong { display: block; color: var(--blue); font-size: 22px; }
    .complete-stat span { color: var(--muted); font-size: 11px; font-weight: 900; }
    .complete-actions { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; }
    .toast {
      position: fixed; left: 50%; bottom: 22px; z-index: 30; transform: translate(-50%, 140px);
      display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 30px); padding: 12px 17px;
      border-radius: 15px; color: var(--navy); background: #fff7c7; border: 1px solid #e2c34d; box-shadow: var(--shadow);
      font-size: 13px; font-weight: 900; transition: transform .3s ease;
    }
    .toast.show { transform: translate(-50%, 0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) {
      .app-shell { padding: 10px; }
      .topbar { position: static; padding: 12px; align-items: flex-start; }
      .top-actions { gap: 5px; }
      .stat-pill, .outline-btn { padding: 8px 10px; font-size: 11px; }
      .stat-pill strong { font-size: 15px; }
      .hero { grid-template-columns: 1fr; gap: 0; }
      .hero-navi { min-height: 180px; margin-top: -5px; }
      .hero-navi img { height: 175px; }
      .navi-caption { right: 8%; }
      .mode-grid, .badge-large-grid { grid-template-columns: 1fr; }
      .study-grid { grid-template-columns: 1fr; }
      .navi-panel { position: static; display: grid; grid-template-columns: 92px 1fr; grid-template-rows: auto auto; gap: 0 10px; text-align: left; align-items: center; }
      .navi-panel .navi-kicker { grid-column: 2; }
      .navi-panel img { grid-column: 1; grid-row: 1 / span 2; height: 105px; margin: 0; }
      .navi-panel .navi-name, .navi-panel .navi-line { grid-column: 2; }
      .navi-panel .navi-line { min-height: auto; }
      .palette-wrap { grid-template-columns: 1fr; }
      .collection-grid { grid-template-columns: repeat(3, 1fr); }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .badges-page-head { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 420px) {
      .brand p { display: none; }
      .top-actions .stat-pill:first-child { display: none; }
      .answer-actions { grid-template-columns: 1fr; }
      .question-text { font-size: 19px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const valueQuestions = [
          { id: 'v1', text: 'y = x + 5 のとき、x = 3 なら y は？', answer: '8', note: '3 + 5 = 8' },
          { id: 'v2', text: 'y = 2 × x のとき、x = 4 なら y は？', answer: '8', note: '2 × 4 = 8' },
          { id: 'v3', text: 'y = x ÷ 2 のとき、x = 10 なら y は？', answer: '5', note: '10 ÷ 2 = 5' },
          { id: 'v4', text: 'y = x + 7 のとき、x = 9 なら y は？', answer: '16', note: '9 + 7 = 16' },
          { id: 'v5', text: 'y = x - 4 のとき、x = 13 なら y は？', answer: '9', note: '13 - 4 = 9' },
          { id: 'v6', text: 'a = 3 × n + 1 のとき、n = 5 なら a は？', answer: '16', note: '3 × 5 + 1 = 16' },
          { id: 'v7', text: 'b = 20 - x のとき、x = 7 なら b は？', answer: '13', note: '20 - 7 = 13' },
          { id: 'v8', text: 'y = 4 × x のとき、x = 6 なら y は？', answer: '24', note: '4 × 6 = 24' },
          { id: 'v9', text: 'y = x ÷ 5 のとき、x = 45 なら y は？', answer: '9', note: '45 ÷ 5 = 9' },
          { id: 'v10', text: 'c = x + 12 のとき、x = 18 なら c は？', answer: '30', note: '18 + 12 = 30' },
          { id: 'v11', text: 'd = 100 - 3 × x のとき、x = 8 なら d は？', answer: '76', note: '100 - 24 = 76' },
          { id: 'v12', text: 'p = 2 × x + 3 のとき、x = 9 なら p は？', answer: '21', note: '18 + 3 = 21' },
          { id: 'v13', text: 'm = x + 15 のとき、x = 20 なら m は？', answer: '35', note: '20 + 15 = 35' },
          { id: 'v14', text: 'k = 6 × x のとき、x = 7 なら k は？', answer: '42', note: '6 × 7 = 42' },
          { id: 'v15', text: 'r = 50 - x のとき、x = 14 なら r は？', answer: '36', note: '50 - 14 = 36' }
        ];
    
    const readingQuestions = [
          { id: 'r1', text: '式 y = 120 + 30 × x が表す場面として正しいものは？', choices: ['1本30円のえんぴつをx本買い、はじめに120円ある。のこりをy円とする', 'はじめに120円あり、1本30円のえんぴつをx本買ったあとの合計金額をy円とする', '1本120円のえんぴつを30本買い、合計をy円とする'], answer: 'はじめに120円あり、1本30円のえんぴつをx本買ったあとの合計金額をy円とする', note: '120に、30ずつふえる分(30×x)を足す。' },
          { id: 'r2', text: '長方形の面積を表す式 S = 6 × x がある。xは何を表す？', choices: ['たてが6cm、よこがxcmのときの面積', 'まわりの長さが6×x cmのときの面積', '6cm²の図形をxこ集めた数'], answer: 'たてが6cm、よこがxcmのときの面積', note: '面積は たて × よこ。' },
          { id: 'r3', text: 'y = 500 - 80 × x の意味として正しいものは？', choices: ['500円を80人で分ける', '500円持っていて、80円のおかしをxこ買ったあとののこり', '80円をx回もらって500円になる'], answer: '500円持っていて、80円のおかしをxこ買ったあとののこり', note: 'はじめの金額から使った分を引く。' },
          { id: 'r4', text: 'm = 7 × x はどんな関係？', choices: ['xを7で割った数がm', 'xに7を足した数がm', 'xを7倍した数がm'], answer: 'xを7倍した数がm', note: '7 × x は「7倍」。' },
          { id: 'r5', text: 't = x ÷ 4 はどんな関係？', choices: ['xを4つに分けた1つ分がt', 'xを4倍した数がt', 'xから4を引いた数がt'], answer: 'xを4つに分けた1つ分がt', note: '÷4 は4等分。' },
          { id: 'r6', text: 'k = 3 × x + 2 の説明として正しいものは？', choices: ['xに2をかけて3を足す', 'xを3倍して2を足す', 'xを3で割って2を足す'], answer: 'xを3倍して2を足す', note: '順番は 3×x のあと +2。' },
          { id: 'r7', text: 'y = 40 × x はどんな意味？', choices: ['40円のノートをx冊買った代金がy円', '40ページの本をx日読む日数がy日', 'x円を40人で分けた1人分がy円'], answer: '40円のノートをx冊買った代金がy円', note: '単価×個数。' },
          { id: 'r8', text: 'y = x + 18 の説明として正しいものは？', choices: ['xから18を引く', 'xに18を足す', 'xを18倍する'], answer: 'xに18を足す', note: '+18 は18をたす。' },
          { id: 'r9', text: 'z = 90 - x はどんな関係？', choices: ['90にxを足した数', '90からxを引いた数', 'xから90を引いた数'], answer: '90からxを引いた数', note: '前の数から後ろの数を引く。' },
          { id: 'r10', text: 'p = x ÷ 3 はどんな意味？', choices: ['xを3等分した1つ分がp', 'xを3倍した数がp', 'xに3を足した数がp'], answer: 'xを3等分した1つ分がp', note: '÷3 は3等分。' },
          { id: 'r11', text: 'y = 250 + 25 × x の場面は？', choices: ['250円から25円ずつ減る', 'はじめに250円あり、25円ずつ増える', '25円を250人で分ける'], answer: 'はじめに250円あり、25円ずつ増える', note: 'はじめの数 + ふえる分。' },

        const input = document.getElementById('answerInput');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }
    function startMode(modeId) {
      state = { ...state, screen: 'study', returnScreen: 'home', mode: modeId, pool: shuffle(modes[modeId].pool), index: 0, input: '', feedback: null, feedbackType: '', solved: false, roundCorrect: 0, roundAnswered: 0, naviIndex: Math.floor(Math.random() * navis.length), naviMood: 'study', newBadge: null };
      if (!progress.attemptedModes.includes(modeId)) progress.attemptedModes.push(modeId);
      checkBadges();
      render();
    }
    function setInput(value) {
      state.input = value;
      const input = document.getElementById('answerInput');
      if (input && input.value !== value) input.value = value;
    }
    function checkAnswer() {
      const current = state.pool[state.index];
      if (!current || state.solved) return;
      if (!state.input.trim()) {
        state.feedback = 'まずは答えを入力してみよう。';
        state.feedbackType = 'try';
        state.naviMood = 'retry';
        render();
        return;
      }
      progress.totalAnswered += 1;
      progress.modeAnswered[state.mode] += 1;
      let ok = false;
      if (state.mode === 'value') ok = normalizeBasic(state.input) === normalizeBasic(current.answer);
      if (state.mode === 'reading') ok = state.input === current.answer;
      if (state.mode === 'build') ok = canonicalExpression(state.input) === canonicalExpression(current.answer);
      if (ok) {
        state.solved = true;
        state.roundCorrect += 1;
        state.roundAnswered += 1;
        progress.totalCorrect += 1;
        progress.modeCorrect[state.mode] += 1;
        progress.score += 10;
        progress.streak += 1;
        progress.maxStreak = Math.max(progress.maxStreak, progress.streak);
        state.feedback = 'せいかい！ ' + current.note;
        state.feedbackType = 'good';
        state.naviMood = 'correct';
        checkBadges();
        saveProgress();
        render();
        showToast('🎉 せいかい！ +10pt');
      } else {
        state.roundAnswered += 1;
        progress.streak = 0;
        state.feedback = 'もう一度！ 正解は「' + current.answer + '」です。 ' + current.note;
        state.feedbackType = 'try';
        state.naviMood = 'retry';
        saveProgress();
        render();
      }
    }
    function nextQuestion() {
      if (!state.solved) {
        state.feedback = 'まず「こたえあわせ」をしてから、つぎへ進もう。';
        state.feedbackType = 'try';
        state.naviMood = 'retry';
        render();
        return;
      }
      if (state.index >= state.pool.length - 1) {
        if (state.roundCorrect === state.pool.length) {
          progress.perfectRounds += 1;
          checkBadges();
        }
        state.screen = 'complete';
        state.naviMood = 'complete';
        render();
        return;
      }
      state.index += 1;
      state.input = '';
      state.feedback = null;
      state.feedbackType = '';
      state.solved = false;
      state.naviIndex = Math.floor(Math.random() * navis.length);
      state.naviMood = 'study';
      render();
    }
    function backHome() {
      state.screen = 'home';
      state.naviMood = 'study';
      render();
    }
    function openBadges() {
      state.returnScreen = state.screen;
      state.screen = 'badges';
      render();
    }
    function retryMode() {
      startMode(state.mode);
    }
    function onKey(key) {
      if (key === '←') setInput(state.input.slice(0, -1));
      else if (key === 'クリア') setInput('');
      else setInput(state.input + key);
    }
    function bindEvents() {
      document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => startMode(button.dataset.mode)));
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'home') backHome();
        if (action === 'back') { state.screen = state.returnScreen || 'home'; render(); }
        if (action === 'badges') openBadges();
        if (action === 'check') checkAnswer();
        if (action === 'next') nextQuestion();
        if (action === 'retry') retryMode();
      }));
      document.querySelectorAll('[data-choice]').forEach(button => button.addEventListener('click', () => {
        if (!state.solved) { state.input = button.dataset.choice; render(); }
      }));
      document.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => {
        if (!state.solved) onKey(button.dataset.key);
      }));
      const input = document.getElementById('answerInput');
      if (input) {
        input.addEventListener('input', event => { state.input = event.target.value; });
        input.addEventListener('keydown', event => { if (event.key === 'Enter') checkAnswer(); });
      }
    }
    render();
  </script>
</body>
</html>
