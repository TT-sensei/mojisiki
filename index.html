<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字と式マスター</title>
<style>
:root {
  --bg:#f4f7ff; --panel:#ffffff; --primary:#2c5fe8; --accent:#ff8a3d; --ok:#1f9d55; --ng:#d94841; --text:#1b2230;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:var(--bg);color:var(--text);padding:14px 14px 210px}
.container{max-width:900px;margin:0 auto}
.header,.panel{background:var(--panel);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.08);margin-bottom:14px}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-size:clamp(1.4rem,2.8vw,2rem);color:var(--primary);font-weight:800}
.problem{font-size:clamp(1.5rem,4vw,2.2rem);text-align:center;line-height:1.5;margin:20px 0;font-weight:800}
.stats{display:flex;gap:12px}
.stat{min-width:80px;text-align:center}.stat small{display:block;color:#607085}.stat b{font-size:1.4rem;color:var(--primary)}
.level-buttons{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px}
.level-btn{min-height:48px;border:2px solid var(--primary);border-radius:12px;background:#fff;font-weight:700;color:var(--primary)}
.level-btn.active{background:var(--primary);color:#fff}
.answer-box{font-size:2rem;border:3px solid #b7c8ff;border-radius:14px;padding:14px;min-height:72px;text-align:center;background:#fbfdff;letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
button{cursor:pointer}
.btn{min-height:44px;border:none;border-radius:12px;padding:10px 16px;font-size:1rem;font-weight:700}
.btn-main{background:var(--primary);color:#fff}.btn-main:active{transform:scale(.98)}
.btn-alt{background:#eef2ff;color:var(--primary)}
.feedback{margin-top:14px;padding:12px;border-radius:12px;font-size:1.15rem;text-align:center;display:none}
.feedback.show{display:block}.feedback.ok{background:#def7e8;color:#0b6e3d}.feedback.ng{background:#ffe5e3;color:#9a241f}
.hint{margin-top:10px;text-align:center;color:#44536a;font-weight:700;min-height:26px}
.stars{text-align:center;font-size:1.6rem;min-height:30px;margin-top:8px}
.bounce{animation:bounce .35s ease}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

.keyboard-wrap{position:fixed;left:0;right:0;bottom:0;background:#e9efff;border-top:2px solid #d2deff;padding:8px 10px 12px;z-index:10}
.keyboard{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.key{min-height:48px;border:none;border-radius:12px;font-size:1.2rem;font-weight:800;transition:transform .08s}
.key:active{transform:scale(.95)}
.key.num{background:#fff;color:#24344d}.key.op{background:#2c5fe8;color:#fff}.key.eq{background:var(--accent);color:#fff}.key.util{background:#6f7d96;color:#fff}
@media (max-width:700px){.keyboard{grid-template-columns:repeat(5,1fr)}body{padding-bottom:250px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">🎯 文字と式マスター</div>
    <div class="stats">
      <div class="stat"><small>スコア</small><b id="score">0</b></div>
      <div class="stat"><small>連続正解</small><b id="streak">0</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="level-buttons" id="levelButtons"></div>
    <div class="problem" id="problemText"></div>
    <div class="answer-box" id="answerBox" aria-label="式入力欄"></div>
    <div class="row">
      <button class="btn btn-main" id="checkBtn">こたえあわせ</button>
      <button class="btn btn-alt" id="nextBtn">つぎのもんだい</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="hint" id="hint"></div>
    <div class="stars" id="stars"></div>
  </div>
</div>

<div class="keyboard-wrap" aria-label="算数キーボード">
  <div class="keyboard" id="mathKeyboard"></div>
</div>

<script>
const audioContext = new (window.AudioContext || window.webkitAudioContext)();
function tone(f, d){const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.value=f;g.gain.value=.18;o.start();g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+d);o.stop(audioContext.currentTime+d);}
function okSound(){tone(530,.08);setTimeout(()=>tone(660,.1),90);} function ngSound(){tone(220,.2);} function tapSound(){tone(420,.04);}

const levels = {
  1: [
    { q:'2x + 3 = □', a:['7'], hint:'x=2 を入れると 2×2+3 です。' },
    { q:'3x + 1 = □', a:['10'], hint:'x=3 を入れて考えよう。' },
    { q:'4x - 5 = □', a:['3'], hint:'x=2 のとき 8-5 です。' }
  ],
  2: [
    { q:'□x + 5 = 11', a:['2'], hint:'x=3 を入れると □×3+5=11。' },
    { q:'2x + □ = 9', a:['3'], hint:'x=3 のとき 6+□=9。' },
    { q:'(□ + 2) ÷ 2 = 4', a:['6'], hint:'両辺を2倍してから考えよう。' }
  ]
};

const praise = ['よくできた！','すごい！','その調子！'];
let state = {level:1,index:0,score:0,streak:0,input:''};

const keys = [
  '7','8','9','x','(',')',
  '4','5','6','+','−','×',
  '1','2','3','*','÷','=',
  '0','.','←','C'
];

function initKeyboard(){
  const kb=document.getElementById('mathKeyboard');
  kb.innerHTML = keys.map(k=>{
    const cls = /\d|\./.test(k) ? 'num' : (k==='='?'eq': (k==='←'||k==='C'?'util':'op'));
    return `<button class="key ${cls}" onclick="pressKey('${k}')">${k}</button>`;
  }).join('');
}

function renderLevels(){
  const el=document.getElementById('levelButtons');
  el.innerHTML=[1,2].map(l=>`<button class="level-btn ${state.level===l?'active':''}" onclick="switchLevel(${l})">レベル${l}</button>`).join('');
}
function switchLevel(l){tapSound();state.level=l;state.index=0;state.input='';state.streak=0;renderLevels();renderQuestion();}
function currentQ(){return levels[state.level][state.index % levels[state.level].length];}

function renderQuestion(){
  document.getElementById('problemText').textContent=currentQ().q;
  document.getElementById('answerBox').textContent=state.input || 'ここにしきが入るよ';
  document.getElementById('score').textContent=state.score;
  document.getElementById('streak').textContent=state.streak;
  document.getElementById('hint').textContent='';
}

function normalize(s){return s.replace(/\s/g,'').replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/');}
function pressKey(k){
  tapSound();
  if(k==='←') state.input = state.input.slice(0,-1);
  else if(k==='C') state.input='';
  else state.input += k;
  document.getElementById('answerBox').textContent = state.input || 'ここにしきが入るよ';
}

function showFeedback(ok,msg){
  const fb=document.getElementById('feedback');
  fb.className=`feedback show ${ok?'ok':'ng'} bounce`;
  fb.textContent=msg;
}

function checkAnswer(){
  const ans = normalize(state.input);
  const valid = currentQ().a.some(a=>ans===normalize(a));
  if(valid){
    okSound();
    state.score += 10;
    state.streak += 1;
    const msg = `⭕ ${praise[Math.floor(Math.random()*praise.length)]}`;
    showFeedback(true,msg);
    if(state.streak>0 && state.streak%3===0){document.getElementById('stars').textContent='⭐️⭐️ 3れんぞくせいかい！';}
    else {document.getElementById('stars').textContent='';}
  } else {
    ngSound();
    state.streak = 0;
    showFeedback(false,'△ おしい！');
    document.getElementById('hint').textContent='ヒント: ' + currentQ().hint;
    document.getElementById('stars').textContent='';
  }
  renderQuestion();
  document.getElementById('feedback').classList.add('show');
}

function nextQuestion(){tapSound();state.index++;state.input='';document.getElementById('feedback').className='feedback';renderQuestion();}

document.getElementById('checkBtn').addEventListener('click',checkAnswer);
document.getElementById('nextBtn').addEventListener('click',nextQuestion);
initKeyboard();renderLevels();renderQuestion();
</script>
</body>
</html>
