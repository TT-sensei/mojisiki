<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字と式パーク（小6）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-sky-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const normalize = (str) =>
      str
        .replace(/\s+/g, '')
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/＝/g, '=')
        .replace(/\(\)/g, '')
        .replace(/(\d)([a-zA-Z])/g, '$1*$2')
        .replace(/([a-zA-Z])(\d)/g, '$1*$2');

    const valueQuestions = [
      { id: 'v1', text: 'y = x + 5 のとき、x = 3 なら y は？', answer: '8', note: '3 + 5 = 8' },
      { id: 'v2', text: 'y = 2x のとき、x = 4 なら y は？', answer: '8', note: '2×4 = 8' },
      { id: 'v3', text: 'y = x ÷ 2 のとき、x = 10 なら y は？', answer: '5', note: '10÷2 = 5' },
      { id: 'v4', text: 'y = x + 0.5 のとき、x = 1.2 なら y は？', answer: '1.7', note: '1.2 + 0.5 = 1.7' },
      { id: 'v5', text: 'y = x + 1/2 のとき、x = 3/2 なら y は？', answer: '2', note: '3/2 + 1/2 = 4/2 = 2' }
    ];

    const readingQuestions = [
      {
        id: 'r1',
        text: '式  y = 120 + 30x  が表す場面として正しいものは？',
        choices: ['1本30円のえんぴつをx本買い、はじめに120円ある。のこりをy円とする', 'はじめに120円あり、1本30円のえんぴつをx本買ったあとの合計金額をy円とする', '1本120円のえんぴつを30本買い、合計をy円とする'],
        answer: 'はじめに120円あり、1本30円のえんぴつをx本買ったあとの合計金額をy円とする',
        note: '120に、30ずつふえる分(30x)を足している。'
      },
      {
        id: 'r2',
        text: '長方形の面積を表す式  S = 6x  がある。xは何を表す？',
        choices: ['たてが6cm、よこがxcmのときの面積', 'まわりの長さが6xcmのときの面積', '6cm²の図形をxこ集めた数'],
        answer: 'たてが6cm、よこがxcmのときの面積',
        note: '面積は たて×よこ。6×x なので長方形の面積。'
      }
    ];

    const palette = ['7','8','9','+','-','x','y','4','5','6','×','÷','=','1','2','3','(',')','0','.','/','←','クリア'];

    function App() {
      const [mode, setMode] = useState('home');
      const [index, setIndex] = useState(0);
      const [input, setInput] = useState('');
      const [feedback, setFeedback] = useState('');
      const [score, setScore] = useState(0);

      const current = useMemo(() => {
        if (mode === 'value') return valueQuestions[index % valueQuestions.length];
        if (mode === 'reading') return readingQuestions[index % readingQuestions.length];
        return null;
      }, [mode, index]);

      const resetRound = (nextMode) => {
        setMode(nextMode);
        setIndex(0);
        setInput('');
        setFeedback('');
      };

      const onPalette = (key) => {
        if (key === '←') return setInput((v) => v.slice(0, -1));
        if (key === 'クリア') return setInput('');
        setInput((v) => v + key);
      };

      const checkAnswer = () => {
        if (!current) return;
        let ok = false;
        if (mode === 'value') {
          ok = normalize(input) === normalize(current.answer);
        }
        if (mode === 'reading') {
          ok = input === current.answer;
        }

        if (ok) {
          setScore((s) => s + 10);
          setFeedback(`せいかい！ ${current.note}`);
        } else {
          setFeedback(`おしい！ 正解: ${current.answer} / ${current.note}`);
        }
      };

      const nextQuestion = () => {
        setIndex((i) => i + 1);
        setInput('');
        setFeedback('');
      };

      return (
        <div className="min-h-screen p-3 md:p-6 font-sans">
          <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-sky-200">
            <header className="p-4 md:p-6 bg-gradient-to-r from-cyan-400 to-indigo-500 text-white">
              <h1 className="text-2xl md:text-3xl font-black">🎈 文字と式パーク（小6）</h1>
              <p className="text-sm md:text-base mt-1">タブレットで楽しく「文字に数をあてはめる」「式の意味を読む」を練習！</p>
              <p className="mt-2 font-bold">スコア: {score} pt</p>
            </header>

            {mode === 'home' && (
              <main className="p-5 md:p-8 space-y-4">
                <section className="bg-yellow-50 border border-yellow-200 rounded-2xl p-4">
                  <h2 className="font-bold text-lg">学習のポイント</h2>
                  <ul className="list-disc pl-5 mt-2 space-y-1 text-sm md:text-base">
                    <li>文字 x に数をあてはめて、対応する y の値を求めよう。</li>
                    <li>整数だけでなく、小数・分数も使ってみよう。</li>
                    <li>「xの値」「yの値」という言い方に慣れよう。</li>
                    <li>式がどんな場面・図形を表すかを言葉で説明しよう。</li>
                  </ul>
                </section>

                <div className="grid md:grid-cols-2 gap-3">
                  <button className="p-4 rounded-2xl bg-cyan-500 text-white font-bold text-lg" onClick={() => resetRound('value')}>① 値をもとめる練習</button>
                  <button className="p-4 rounded-2xl bg-indigo-500 text-white font-bold text-lg" onClick={() => resetRound('reading')}>② 式の意味を読む練習</button>
                </div>
              </main>
            )}

            {(mode === 'value' || mode === 'reading') && current && (
              <main className="p-5 md:p-8 space-y-4">
                <button className="text-sm text-indigo-600" onClick={() => setMode('home')}>← ホームへ</button>
                <div className="bg-slate-50 rounded-2xl p-4 border">
                  <p className="font-bold">もんだい {index + 1}</p>
                  <p className="mt-2 text-lg">{current.text}</p>
                </div>

                {mode === 'reading' ? (
                  <div className="space-y-2">
                    {current.choices.map((choice) => (
                      <button key={choice} className={`w-full text-left p-3 rounded-xl border ${input===choice ? 'bg-indigo-100 border-indigo-400' : 'bg-white'}`} onClick={() => setInput(choice)}>
                        {choice}
                      </button>
                    ))}
                  </div>
                ) : (
                  <>
                    <input className="w-full border-2 border-sky-200 p-3 rounded-xl text-2xl" value={input} onChange={(e) => setInput(e.target.value)} placeholder="こたえを入力" />
                    <div className="grid grid-cols-6 gap-2">
                      {palette.map((key) => (
                        <button key={key} className="p-3 rounded-xl bg-sky-100 font-bold" onClick={() => onPalette(key)}>{key}</button>
                      ))}
                    </div>
                  </>
                )}

                <div className="grid grid-cols-2 gap-3">
                  <button className="p-3 rounded-xl bg-emerald-500 text-white font-bold" onClick={checkAnswer}>こたえあわせ</button>
                  <button className="p-3 rounded-xl bg-gray-700 text-white font-bold" onClick={nextQuestion}>つぎの問題</button>
                </div>

                {feedback && <div className={`p-3 rounded-xl ${feedback.startsWith('せいかい') ? 'bg-green-50 text-green-700' : 'bg-rose-50 text-rose-700'}`}>{feedback}</div>}
              </main>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
